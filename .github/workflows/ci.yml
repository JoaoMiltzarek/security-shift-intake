name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  TZ: UTC
  UV_VERSION: "0.11.28"

jobs:
  quality:
    name: format - lint - typecheck - test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialize quality diagnostics
        run: |
          mkdir -p /tmp/quality-diagnostics
          printf 'commit=%s\nrunner=%s\n' "${{ github.sha }}" "${{ runner.os }}" \
            > /tmp/quality-diagnostics/ci-context.txt

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.11.15
        run: uv python install 3.11.15

      - name: Sync dependencies (from uv.lock)
        run: uv sync --locked --python 3.11.15

      - name: Verify Python runtime
        run: uv run --locked --python 3.11.15 python -c "import sys; assert sys.version_info[:3] == (3, 11, 15)"

      - name: Audit locked dependencies
        run: make audit-deps

      - name: Preflight (warnings reported, blockers enforced)
        run: |
          set +e
          uv run --locked python scripts/preflight.py --json --with-test-baseline \
            | tee /tmp/quality-diagnostics/preflight.json
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ge 2 ]; then
            exit "$status"
          fi

      - name: Format check (ruff)
        run: make format-check

      - name: Lint (ruff)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Test (pytest)
        run: set -o pipefail; make test 2>&1 | tee /tmp/quality-diagnostics/pytest.log

      - name: Validate configs (schema-for-the-schema)
        run: make validate-config

      - name: Privacy check (no real data / PII)
        id: privacy
        run: set -o pipefail; make privacy-check 2>&1 | tee /tmp/quality-diagnostics/privacy.log

      - name: Evidence report (authoritative collector — uploaded, not committed)
        if: ${{ success() && steps.privacy.outcome == 'success' }}
        run: >
          uv run --locked python scripts/evidence_report.py
          --preflight /tmp/quality-diagnostics/preflight.json
          --pytest-log /tmp/quality-diagnostics/pytest.log
          --privacy-log /tmp/quality-diagnostics/privacy.log
          --authoritative-sha ${{ github.sha }}
          --out /tmp/quality-diagnostics/SSI-1002_EVIDENCE.md

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-diagnostics-${{ github.sha }}
          path: /tmp/quality-diagnostics/
          if-no-files-found: error

  quality-windows:
    name: quality (Windows 2025 clean checkout)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the checkout has no inherited environment
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .venv) {
            throw "Unexpected inherited .venv in clean checkout."
          }

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.11.15
        run: uv python install 3.11.15

      - name: Sync dependencies (from uv.lock)
        run: uv sync --locked --python 3.11.15

      - name: Verify exact sync and TestClient compatibility
        run: |
          uv sync --locked --check
          uv run --locked --no-sync python -m scripts.check_test_environment

      - name: Verify Python runtime
        run: uv run --locked --python 3.11.15 python -c "import sys; assert sys.version_info[:3] == (3, 11, 15)"

      - name: Audit locked dependencies
        run: uv run --locked python -m scripts.audit_locked_dependencies

      - name: Format check (ruff)
        run: uv run --locked ruff format --check .

      - name: Lint (ruff)
        run: uv run --locked ruff check .

      - name: Typecheck (mypy)
        run: uv run --locked mypy src data scripts evals

      - name: Test (pytest)
        run: uv run --locked pytest

      - name: Validate configs
        run: uv run --locked python -m scripts.validate_config configs/controle_ocorrencias.yaml

      - name: Privacy check
        run: uv run --locked python -m scripts.privacy_check

  # SSI-1010: mede a promessa CENTRAL do produto (falha estrutural de parse nunca vira
  # "sem alteração" aceito) com Tesseract real sobre o split val congelado. Gates
  # binários: unsafe_clean=0, safe_review_recall=1.0, false_incident_unreviewed=0 —
  # BLOQUEANTE (false_incident_count é reportado como ruído do reader, não gate).
  eval-safety:
    name: eval-safety (structural gates — BLOCKING)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Initialize safety-eval diagnostics
        run: |
          mkdir -p /tmp/eval_safety
          printf 'commit=%s\nrunner=%s\n' "${{ github.sha }}" "${{ runner.os }}" \
            > /tmp/eval_safety/ci-context.txt

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tesseract (+ Portuguese pack)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Verify Tesseract runtime
        run: |
          set -euo pipefail
          tesseract --version 2>&1 | tee /tmp/eval_safety/tesseract-version.txt
          tesseract --list-langs | tee /tmp/eval_safety/tesseract-langs.txt
          grep -qx por /tmp/eval_safety/tesseract-langs.txt

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.11.15
        run: uv python install 3.11.15

      - name: Sync dependencies (from uv.lock)
        run: uv sync --locked --python 3.11.15

      - name: Verify Python runtime
        run: uv run --locked --python 3.11.15 python -c "import sys; assert sys.version_info[:3] == (3, 11, 15)"

      - name: Verify the release manifest freeze is versioned
        run: test -f data/manifests/tier_c_manifest_v2/bench-balanced.val.jsonl

      - name: Generate canonical synthetic safety dataset
        run: make gen-safety-sheets

      - name: Run committed showcase fixture through real Tesseract
        env:
          SSI_REQUIRE_TESSERACT: "1"
        run: >-
          uv run --locked pytest
          tests/test_showcase_demo.py::test_committed_showcase_fixture_persists_real_ocr_geometry

      - name: Run structural-safety gates (val split, Tesseract)
        run: set -o pipefail; make eval-safety DPI=150 OUT=/tmp/eval_safety 2>&1 | tee /tmp/eval_safety/eval.log

      - name: Validate release-candidate summary
        run: >-
          uv run --locked python -m scripts.publish_eval_evidence
          --source /tmp/eval_safety/eval_synthetic_summary.json
          --expected-commit "$(git rev-parse HEAD)"

      - name: Upload validated intermediate summary
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-safety-intermediate-${{ github.sha }}
          path: /tmp/eval_safety/eval_synthetic_summary.json
          if-no-files-found: error

      - name: Upload safety-eval diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-safety-diagnostics-${{ github.sha }}
          path: /tmp/eval_safety/
          if-no-files-found: error

  browser-smoke:
    name: browser-smoke (cockpit UI gate — BLOCKING)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialize browser diagnostics
        run: |
          mkdir -p /tmp/browser-smoke
          printf 'commit=%s\nrunner=%s\n' "${{ github.sha }}" "${{ runner.os }}" \
            > /tmp/browser-smoke/ci-context.txt

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.11.15
        run: uv python install 3.11.15

      - name: Sync dependencies (from uv.lock)
        run: uv sync --locked --python 3.11.15

      - name: Verify Python runtime
        run: uv run --locked --python 3.11.15 python -c "import sys; assert sys.version_info[:3] == (3, 11, 15)"

      - name: Install Playwright Chromium
        run: uv run --locked playwright install --with-deps chromium

      - name: Browser-smoke (bbox / overlay / save / CSP violations)
        env:
          BROWSER_SMOKE_SCREENSHOT: /tmp/browser-smoke/browser-smoke.png
        run: |
          set -o pipefail
          mkdir -p private
          INTAKE_CONFIG=configs/controle_ocorrencias.yaml \
            uv run --locked uvicorn src.api.asgi:app --host 127.0.0.1 --port 8000 \
            > /tmp/browser-smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          uv run --locked python scripts/browser_smoke.py 2>&1 \
            | tee /tmp/browser-smoke/browser-smoke.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-smoke-diagnostics-${{ github.sha }}
          path: /tmp/browser-smoke/
          if-no-files-found: error

  # O JSON só se torna candidato promovível depois que TODOS os gates bloqueantes
  # deste mesmo commit passam. O artifact do job eval-safety é intermediário.
  release-evidence-candidate:
    name: release-evidence candidate (all gates passed)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, quality-windows, eval-safety, browser-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.11.15
        run: uv python install 3.11.15

      - name: Sync dependencies (from uv.lock)
        run: uv sync --locked --python 3.11.15

      - name: Verify Python runtime
        run: uv run --locked --python 3.11.15 python -c "import sys; assert sys.version_info[:3] == (3, 11, 15)"

      - name: Download validated intermediate summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: eval-safety-intermediate-${{ github.sha }}
          path: /tmp/release_candidate

      - name: Revalidate release-candidate summary
        run: >-
          uv run --locked python -m scripts.publish_eval_evidence
          --source /tmp/release_candidate/eval_synthetic_summary.json
          --expected-commit "$(git rev-parse HEAD)"

      - name: Upload promotable release-candidate summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-safety-release-candidate-${{ github.sha }}
          path: /tmp/release_candidate/eval_synthetic_summary.json
          if-no-files-found: error
