# configs/controle_ocorrencias.yaml
# Supported v1 report: a scanned, handwritten "Controle de Ocorrências" sheet.
# The runtime validates this exact header and occurrence-table shape before startup.
# S/A or a crossed-out table is treated as an explicit no-change disposition.

report_type: controle_ocorrencias

fields:
  - name: data_turno
    type: string
    required: true
    handwritten: true
    ocr_aliases: ["Data e Turno", "Data e Turno:", "Data"]

  - name: vigilantes
    type: string
    required: true
    handwritten: true
    ocr_aliases: ["Vigilantes", "Vigilantes:", "Vigilante"]

  - name: unidade
    type: string
    required: true
    handwritten: true
    ocr_aliases: ["Unidade", "Unidade:"]

  - name: ocorrencias
    type: table
    required: false
    handwritten: true
    columns:
      - name: item
        type: string
        ocr_aliases: ["Item"]
      - name: hora
        type: string
        ocr_aliases: ["Hora"]
      - name: descricao
        type: text
        ocr_aliases: ["Descrição da Ocorrência", "Descrição", "Descricao"]
      - name: acao
        type: string
        ocr_aliases: ["Ação", "Acao"]
      - name: resolvido
        type: enum
        values: [sim, nao]
        ocr_aliases: ["Resolvido (sim/não)", "Resolvido"]

classification:
  type:
    labels: [routine, access_violation, equipment, safety, theft, other]
  urgency:
    labels: [low, medium, high, critical]
  sector:
    labels: [tech_security, general_support, facilities]
  rules:
    - id: incident.theft
      keywords: [furto, subtracao, subtração]
      type: theft
      urgency: high
      sector: tech_security
    - id: incident.access_violation
      keywords: [acesso, cracha, crachá]
      type: access_violation
      urgency: medium
      sector: tech_security
    - id: incident.safety
      keywords: [incendio, incêndio, alarme, vazamento, risco]
      type: safety
      urgency: high
      sector: facilities
    - id: incident.equipment
      keywords: [equipamento, camera, câmera, portao, portão, monitoramento]
      type: equipment
      urgency: medium
      sector: facilities
    - id: incident.other
      keywords: []
      type: other
      urgency: medium
      sector: general_support

routing:
  - id: routing.critical
    when:
      urgency: critical
    recipients: [tech_security_oncall, general_support]

  - id: routing.theft
    when:
      type: theft
    recipients: [tech_security, general_support]

  - id: routing.safety
    when:
      type: safety
    recipients: [facilities]

  - id: routing.equipment
    when:
      type: equipment
    recipients: [facilities]

  - id: routing.access_violation
    when:
      type: access_violation
    recipients: [tech_security]

  # Default catch-all — must be last.
  - id: routing.default
    recipients: [general_support]

performance:
  max_seconds_per_sheet: 300  # SLO oficial congelado — ver EVAL_PROTOCOL §5

# Operational outputs are derived from the normalized occurrence model in code.
